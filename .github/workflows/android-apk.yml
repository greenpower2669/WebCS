name: Build WebCS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :android:poc-camera:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebCS-v0.11.2-debug-apk
          path: android/poc-camera/build/outputs/apk/debug/poc-camera-debug.apk
          if-no-files-found: error
