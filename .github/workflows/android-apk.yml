name: Build WebCS APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'tools/hotfix_camera_analysis.py'
      - 'tools/add_reload_gesture.py'
      - 'tools/add_orientation_target_calibration.py'
      - 'tools/add_context_reload_data.py'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply CameraX analysis hotfix
        run: python3 tools/hotfix_camera_analysis.py

      - name: Add calibrated reload gesture
        run: python3 tools/add_reload_gesture.py

      - name: Add orientation gate and enemy target calibration
        run: python3 tools/add_orientation_target_calibration.py

      - name: Add contextual reload and arbitration data
        run: python3 tools/add_context_reload_data.py

      - name: Commit generated source changes if needed
        shell: bash
        run: |
          if ! git diff --quiet -- android/poc-camera/src/main/java/online/tek4all/webcs/poc/CameraForegroundService.kt android/poc-camera/src/main/java/online/tek4all/webcs/poc/MainActivity.kt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add android/poc-camera/src/main/java/online/tek4all/webcs/poc/CameraForegroundService.kt android/poc-camera/src/main/java/online/tek4all/webcs/poc/MainActivity.kt
            git commit -m "Add contextual reload state and arbitration CSV"
            git push
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :android:poc-camera:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WebCS-v0.8.0-debug-apk
          path: android/poc-camera/build/outputs/apk/debug/poc-camera-debug.apk
          if-no-files-found: error
