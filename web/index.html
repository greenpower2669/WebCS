<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <title>WebCS POC</title>
</head>
<body>
  <main class="app" id="app">
    <section class="camera">
      <video id="video" playsinline muted></video>
      <div class="reticle" aria-hidden="true"></div>
      <div class="hud"><span id="score">Score 0</span> · <span id="samples">0 scans</span></div>
    </section>

    <section class="panel">
      <div class="row">
        <button class="primary" id="startBtn">Démarrer caméra</button>
        <button class="primary" id="scanBtn" disabled>SCAN</button>
        <button class="secondary" id="ecoBtn" disabled>Mode éco</button>
      </div>

      <div class="row">
        <label><input type="checkbox" id="recordToggle"> REC dataset</label>
        <select id="labelSelect" aria-label="Étiquette dataset">
          <option value="blue">Bleu</option>
          <option value="not-blue">Pas bleu</option>
          <option value="unknown">Inconnu</option>
        </select>
        <button class="secondary" id="exportBtn">Exporter CSV</button>
      </div>

      <div class="row">
        <span class="pill" id="decision">En attente</span>
        <span class="pill" id="rgb">RGB —</span>
        <span class="pill" id="hsv">HSV —</span>
      </div>

      <div class="status" id="status">
        Le POC n'enregistre ni photo ni vidéo. À chaque scan il lit seulement 5 petits points autour du centre du viseur et fait un vote de couleur local.
      </div>
    </section>
  </main>

  <canvas id="sampleCanvas" width="640" height="480" hidden></canvas>
  <script src="app.js" defer></script>
</body>
</html>
